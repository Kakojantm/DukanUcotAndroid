
name: Build Dukan Ucot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check project ZIP
        run: |
          test -f DukanUcotAndroid_Project.zip
          unzip -t DukanUcotAndroid_Project.zip

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o DukanUcotAndroid_Project.zip -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle
          test -f source/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dukan-Ucot-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
